<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Evan — Full-stack developer</title>
  <desc id="desc">Animated cyber-inspired profile banner with a terminal prompt and orbiting particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.5" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#130b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff3d81"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#00d9ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#58a6ff" stroke-opacity=".075"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminalClip"><rect x="118" y="227" width="930" height="30" rx="4"/></clipPath>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="70" r="260" fill="url(#orb)">
    <animate attributeName="r" values="220;280;220" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;.95;.65" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="290" r="190" fill="#7c3aed" opacity=".07">
    <animate attributeName="r" values="175;215;175" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".65">
    <circle cx="1060" cy="78" r="3" fill="#00d9ff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 980 155" to="360 980 155" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="45" r="2.5" fill="#ff3d81" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="360 980 155" to="0 980 155" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1025" cy="246" r="2" fill="#8b5cf6" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 980 155" to="360 980 155" dur="17s" repeatCount="indefinite"/>
    </circle>
    <path d="M850 155a130 130 0 1 0 260 0 130 130 0 1 0-260 0" fill="none" stroke="#00d9ff" stroke-opacity=".13" stroke-dasharray="5 12">
      <animateTransform attributeName="transform" type="rotate" from="0 980 155" to="360 980 155" dur="26s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="92" y="76" fill="#8b949e" font-size="17" letter-spacing="3">HELLO, WORLD — I'M</text>
    <text x="88" y="158" fill="url(#accent)" font-size="78" font-weight="800" letter-spacing="7" filter="url(#glow)">EVAN</text>
    <text x="94" y="202" fill="#c9d1d9" font-size="21" letter-spacing="1.5">FULL-STACK DEVELOPER  •  CS STUDENT  •  BUILDER</text>

    <rect x="89" y="222" width="1022" height="44" rx="9" fill="#050810" stroke="#30363d"/>
    <circle cx="110" cy="244" r="5" fill="#ff5f57"/>
    <circle cx="128" cy="244" r="5" fill="#febc2e"/>
    <circle cx="146" cy="244" r="5" fill="#28c840"/>
    <text x="174" y="251" fill="#00d9ff" font-size="17">evan@github</text>
    <text x="293" y="251" fill="#8b949e" font-size="17">:</text>
    <text x="303" y="251" fill="#7c3aed" font-size="17">~/ideas</text>
    <text x="371" y="251" fill="#c9d1d9" font-size="17">$ ship --make-it-real</text>
    <rect x="594" y="235" width="10" height="20" rx="1" fill="#00d9ff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".5" stroke-width="2"/>
  <rect x="0" y="317" width="1200" height="13" rx="0 0 24 24" fill="url(#accent)" opacity=".8">
    <animate attributeName="opacity" values=".45;.9;.45" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
